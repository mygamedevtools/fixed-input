name: 🧪 Tests
on:
  # Keep these two lists in sync. GitHub Actions does not support YAML anchors.
  push:
    branches:
      - main
    paths:
      # The Unity project: the package under test, the manifests that resolve its
      # dependencies, and the editor version the project opens with.
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      # The workflow that decides what gets tested and how; the shared steps live
      # in mygamedevtools/unity-package-ci.
      - '.github/workflows/test.yml'
      # Docs never change behavior, including docs shipped inside a package.
      - '!**.md'
  pull_request:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/test.yml'
      - '!**.md'
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  test:
    name: Tests
    uses: mygamedevtools/unity-package-ci/.github/workflows/test.yml@v1
    with:
      coverage-assemblies: '+MyGameDevTools.FixedInput,+MyGameDevTools.FixedInput.Entities'
    secrets: inherit
